<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="650"
  viewBox="0 0 1000 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Object là ngôi nhà, variable là địa chỉ</title>
  <desc id="desc">
    Hai binding a và b cùng liên kết tới một object. Khi b.x được thay đổi từ
    1 thành 2, cả a và b đều quan sát cùng một object nên đều thấy trạng thái mới.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="1000"
    height="650"
    rx="24"
    fill="#0B0E13"
  />

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <text
    x="500"
    y="55"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="29"
    font-weight="700"
    fill="#FFFFFF"
  >
    Object là “Ngôi nhà” — Variable là “Địa chỉ”
  </text>

  <text
    x="500"
    y="85"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    a và b có thể cùng liên kết tới cùng một object
  </text>

  <!-- =========================================================
       STEP 1 — TWO BINDINGS → ONE OBJECT
       ========================================================= -->
  <rect
    x="70"
    y="120"
    width="860"
    height="225"
    rx="20"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <rect
    x="98"
    y="143"
    width="145"
    height="34"
    rx="17"
    fill="#1D2430"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="170.5"
    y="166"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    font-weight="600"
    fill="#AAB2BF"
  >
    ① Cùng một object
  </text>

  <!-- Code -->
  <rect
    x="285"
    y="140"
    width="430"
    height="78"
    rx="11"
    fill="#0B0E13"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="315"
    y="171"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="17"
    fill="#FFFFFF"
  >
    const a = { x: 1 };
  </text>

  <text
    x="315"
    y="200"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="17"
    fill="#FFFFFF"
  >
    const b = a;
  </text>

  <!-- Binding a -->
  <rect
    x="135"
    y="250"
    width="120"
    height="56"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="195"
    y="285"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="600"
    fill="#FFFFFF"
  >
    a
  </text>

  <!-- Binding b -->
  <rect
    x="745"
    y="250"
    width="120"
    height="56"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="805"
    y="285"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="600"
    fill="#FFFFFF"
  >
    b
  </text>

  <!-- Object -->
  <rect
    x="410"
    y="248"
    width="180"
    height="72"
    rx="15"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.8"
  />

  <text
    x="500"
    y="268"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="600"
    fill="#AAB2BF"
  >
    OBJECT
  </text>

  <text
    x="500"
    y="296"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="22"
    font-weight="600"
    fill="#FFFFFF"
  >
    { x: 1 }
  </text>

  <!-- a connector -->
  <path
    d="M 255 278 C 315 278, 350 278, 405 278"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.5"
    marker-end="url(#arrow)"
  />

  <!-- b connector -->
  <path
    d="M 745 278 C 685 278, 650 278, 595 278"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.5"
    marker-end="url(#arrow)"
  />

  <text
    x="330"
    y="265"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
    font-weight="bold"
  >
    cùng liên kết
  </text>

  <text
    x="670"
    y="265"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
    font-weight="bold"
  >
    cùng liên kết
  </text>

  <!-- =========================================================
       TRANSITION
       ========================================================= -->
  <rect
    x="335"
    y="370"
    width="330"
    height="56"
    rx="11"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <text
    x="500"
    y="405"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="18"
    fill="#FFFFFF"
  >
    b.x = 2;
  </text>

  <line
    x1="500"
    y1="427"
    x2="500"
    y2="462"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="520"
    y="449"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
    font-weight="bold"
  >
    mutate object
  </text>

  <!-- =========================================================
       STEP 2 — SHARED UPDATED OBJECT
       ========================================================= -->
  <rect
    x="70"
    y="475"
    width="860"
    height="145"
    rx="20"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <rect
    x="98"
    y="495"
    width="155"
    height="34"
    rx="17"
    fill="#1D2430"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="175.5"
    y="518"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    font-weight="600"
    fill="#AAB2BF"
  >
    ② Cùng thấy thay đổi
  </text>

  <!-- a label -->
  <text
    x="180"
    y="566"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="23"
    font-weight="600"
    fill="#FFFFFF"
  >
    a
  </text>

  <!-- b label -->
  <text
    x="820"
    y="566"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="23"
    font-weight="600"
    fill="#FFFFFF"
  >
    b
  </text>

  <!-- Shared object -->
  <rect
    x="385"
    y="535"
    width="230"
    height="58"
    rx="13"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.8"
  />

  <text
    x="500"
    y="570"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="21"
    font-weight="600"
    fill="#FFFFFF"
  >
    { x: 2 }
  </text>

  <!-- Connectors to updated object -->
  <line
    x1="205"
    y1="560"
    x2="380"
    y2="565"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <line
    x1="795"
    y1="560"
    x2="620"
    y2="565"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <!-- Shared-state annotation -->
  <text
    x="500"
    y="613"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
    font-weight="bold"
  >
    Một object được mutate → mọi binding cùng tham chiếu object đó quan sát trạng thái mới
  </text>
</svg>