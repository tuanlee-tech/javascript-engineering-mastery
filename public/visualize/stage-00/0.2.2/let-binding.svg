<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 860 470"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">let binding có thể được gán lại sang giá trị khác</title>
  <desc id="desc">
    Sau khi thực hiện score = 20, binding score không còn liên kết với 10
    mà liên kết với 20. Giá trị 10 vẫn được biểu diễn riêng và không còn
    là giá trị hiện tại của binding score.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="860"
    height="470"
    rx="24"
    fill="#0B0E13"
  />

  <!-- Header -->
  <text
    x="430"
    y="54"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#FFFFFF"
  >
    Binding có thể được gán lại
  </text>

  <text
    x="430"
    y="82"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      let
    </tspan>
    <tspan> cho phép binding </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      score
    </tspan>
    <tspan> chuyển sang giá trị khác</tspan>
  </text>

  <!-- Code -->
  <rect
    x="270"
    y="114"
    width="320"
    height="58"
    rx="10"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <text
    x="430"
    y="151"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="21"
    fill="#FFFFFF"
  >
    score = 20;
  </text>

  <!-- Main conceptual area -->
  <rect
    x="90"
    y="205"
    width="680"
    height="185"
    rx="18"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <!-- Binding label -->
  <rect
    x="120"
    y="265"
    width="145"
    height="64"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="192.5"
    y="305"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="23"
    font-weight="600"
    fill="#FFFFFF"
  >
    score
  </text>

  <!-- Old relationship -->
  <line
    x1="265"
    y1="297"
    x2="350"
    y2="250"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-dasharray="6 6"
  />

  <text
    x="305"
    y="251"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    fill="#AAB2BF"
  >
    liên kết cũ
  </text>

  <!-- New relationship -->
  <line
    x1="265"
    y1="297"
    x2="520"
    y2="297"
    stroke="#FFFFFF"
    stroke-width="2.5"
    marker-end="url(#arrow)"
  />

  <text
    x="390"
    y="285"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    fill="#FFFFFF"
  >
    binding mới
  </text>

  <!-- Old value -->
  <rect
    x="350"
    y="222"
    width="125"
    height="68"
    rx="12"
    fill="#1D2430"
    stroke="#374151"
    stroke-width="1.5"
    opacity="0.72"
  />

  <text
    x="412.5"
    y="264"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="28"
    font-weight="700"
    fill="#AAB2BF"
  >
    10
  </text>

  <text
    x="412.5"
    y="309"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
  >
    giá trị cũ
  </text>

  <!-- New value -->
  <rect
    x="520"
    y="262"
    width="155"
    height="72"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.8"
  />

  <text
    x="597.5"
    y="307"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="30"
    font-weight="700"
    fill="#FFFFFF"
  >
    20
  </text>

  <text
    x="597.5"
    y="356"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#FFFFFF"
  >
    giá trị hiện tại
  </text>

  <!-- Bottom takeaway -->
  <rect
    x="170"
    y="410"
    width="520"
    height="36"
    rx="18"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="430"
    y="433"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14"
    fill="#AAB2BF"
  >
    score không “đổi nội dung bên trong” — binding chuyển từ 10 → 20
  </text>
</svg>