<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 900 560"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">const giữ nguyên binding, nhưng object có thể thay đổi bên trong</title>
  <desc id="desc">
    Binding user vẫn giữ nguyên và tiếp tục tham chiếu đến cùng một object.
    Tuy nhiên property name bên trong object có thể thay đổi từ A thành B.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="900"
    height="560"
    rx="24"
    fill="#0B0E13"
  />

  <!-- Header -->
  <text
    x="450"
    y="54"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#FFFFFF"
  >
    const: Binding không đổi, Object vẫn có thể thay đổi
  </text>

  <text
    x="450"
    y="84"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    Không thể đổi binding
    <tspan> </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">user</tspan>
    <tspan>, nhưng có thể thay đổi property của object mà nó tham chiếu.</tspan>
  </text>

  <!-- Code -->
  <rect
    x="255"
    y="116"
    width="390"
    height="62"
    rx="10"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <text
    x="450"
    y="155"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="21"
    fill="#FFFFFF"
  >
    const user = { name: "A" };
  </text>

  <!-- Main model -->
  <rect
    x="70"
    y="210"
    width="760"
    height="290"
    rx="20"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <!-- Binding -->
  <rect
    x="105"
    y="305"
    width="150"
    height="66"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="180"
    y="346"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="600"
    fill="#FFFFFF"
  >
    user
  </text>

  <!-- Const indicator -->
  <rect
    x="133"
    y="260"
    width="94"
    height="28"
    rx="14"
    fill="#1D2430"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="180"
    y="279"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="13"
    fill="#AAB2BF"
  >
    const
  </text>

  <text
    x="180"
    y="397"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
  >
    binding cố định
  </text>

  <!-- Binding relationship -->
  <line
    x1="255"
    y1="338"
    x2="335"
    y2="338"
    stroke="#FFFFFF"
    stroke-width="2.5"
    marker-end="url(#arrow)"
  />

  <text
    x="295"
    y="320"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
  >
    bind
  </text>

  <!-- Object -->
  <rect
    x="335"
    y="245"
    width="285"
    height="175"
    rx="16"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.8"
  />

  <text
    x="365"
    y="278"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    font-weight="600"
    fill="#AAB2BF"
  >
    Object
  </text>

  <line
    x1="365"
    y1="292"
    x2="590"
    y2="292"
    stroke="#374151"
    stroke-width="1"
  />

  <!-- Property row -->
  <text
    x="365"
    y="332"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="17"
    fill="#FFFFFF"
  >
    name
  </text>

  <text
    x="455"
    y="332"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="17"
    fill="#AAB2BF"
  >
    =
  </text>

  <rect
    x="480"
    y="305"
    width="85"
    height="42"
    rx="9"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="522.5"
    y="332"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="18"
    font-weight="600"
    fill="#FFFFFF"
  >
    "A"
  </text>

  <!-- Mutation arrow -->
  <path
    d="M 477 365 C 535 390, 535 390, 480 397"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="555"
    y="382"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
  >
    thay đổi property
  </text>

  <!-- Mutation statement -->
  <rect
    x="275"
    y="448"
    width="350"
    height="42"
    rx="9"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1"
  />

  <text
    x="450"
    y="475"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="16"
    fill="#FFFFFF"
  >
    user.name = "B";
  </text>

  <!-- Bottom callout -->
  <rect
    x="120"
    y="516"
    width="660"
    height="26"
    rx="13"
    fill="#151A22"
  />

  <text
    x="450"
    y="534"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    fill="#AAB2BF"
  >
    Binding vẫn trỏ đến cùng object • Property bên trong object đổi từ "A" → "B"
  </text>
</svg>