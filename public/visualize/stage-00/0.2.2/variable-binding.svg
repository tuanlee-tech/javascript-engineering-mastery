<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="430"
  viewBox="0 0 760 430"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Variable là Binding — score được bind với giá trị 10</title>
  <desc id="desc">
    Biến score không phải là một chiếc hộp chứa giá trị. score là một binding,
    được liên kết với giá trị 10.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path
        d="M 0 0 L 10 5 L 0 10 z"
        fill="#FFFFFF"
      />
    </marker>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="760"
    height="430"
    rx="24"
    fill="#0B0E13"
  />

  <!-- Header -->
  <text
    x="380"
    y="58"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#FFFFFF"
  >
    Variable là Binding
  </text>

  <text
    x="380"
    y="88"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="16"
    fill="#AAB2BF"
  >
    <tspan>score</tspan>
    <tspan> </tspan>
    <tspan>được bind với một giá trị</tspan>
  </text>

  <!-- Code -->
  <rect
    x="245"
    y="122"
    width="270"
    height="56"
    rx="10"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <text
    x="380"
    y="158"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="20"
    fill="#FFFFFF"
  >
    let score = 10;
  </text>

  <!-- Binding concept -->
  <rect
    x="120"
    y="214"
    width="520"
    height="150"
    rx="18"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <!-- Label -->
  <rect
    x="170"
    y="250"
    width="150"
    height="60"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="245"
    y="288"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="23"
    font-weight="600"
    fill="#FFFFFF"
  >
    score
  </text>

  <!-- Binding arrow -->
  <line
    x1="320"
    y1="280"
    x2="420"
    y2="280"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="370"
    y="258"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    fill="#AAB2BF"
  >
    binding
  </text>

  <!-- Value -->
  <rect
    x="420"
    y="244"
    width="150"
    height="72"
    rx="12"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="495"
    y="290"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="30"
    font-weight="700"
    fill="#FFFFFF"
  >
    10
  </text>

  <!-- Bottom takeaway -->
  <text
    x="380"
    y="397"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    Không phải “score chứa 10” — mà là “score đang bind với 10”
  </text>
</svg>