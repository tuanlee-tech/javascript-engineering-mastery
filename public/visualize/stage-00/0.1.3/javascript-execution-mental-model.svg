<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 820"
  width="1200"
  height="820"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">JavaScript Execution ở mức khái niệm</title>

  <desc id="desc">
    Luồng thực thi JavaScript ở mức khái niệm: Source Code đi qua Parse Phase
    rồi đến Execution Phase. Lỗi cú pháp được phát hiện trong quá trình phân tích
    cú pháp; runtime error có thể phát sinh trong quá trình thực thi.
  </desc>

  <!-- ========================================================= -->
  <!-- Background -->
  <!-- ========================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="820"
    rx="28"
    fill="#0B0E13"
  />

  <!-- ========================================================= -->
  <!-- Title -->
  <!-- ========================================================= -->

  <text
    x="600"
    y="55"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="29"
    font-weight="700"
    fill="#FFFFFF"
  >
    JavaScript Execution ở mức khái niệm
  </text>

  <text
    x="600"
    y="86"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    Từ source code → phân tích cú pháp → thực thi
  </text>

  <!-- ========================================================= -->
  <!-- SOURCE CODE -->
  <!-- ========================================================= -->

  <rect
    x="100"
    y="135"
    width="1000"
    height="145"
    rx="24"
    fill="#151A22"
    stroke="#FFFFFF"
    stroke-width="2.5"
  />

  <!-- Number -->
  <circle
    cx="155"
    cy="180"
    r="24"
    fill="#FFFFFF"
  />

  <text
    x="155"
    y="188"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="19"
    font-weight="700"
    fill="#0B0E13"
  >
    1
  </text>

  <text
    x="200"
    y="178"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="23"
    font-weight="700"
    fill="#FFFFFF"
  >
    Source Code
  </text>

  <text
    x="200"
    y="207"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#9CA3AF"
  >
    Mã nguồn JavaScript
  </text>

  <!-- Code sample -->
  <rect
    x="200"
    y="225"
    width="830"
    height="38"
    rx="10"
    fill="#202631"
  />

  <text
    x="222"
    y="250"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="14"
    fill="#E5E7EB"
  >
    const result = add(10, 20);
  </text>

  <!-- ========================================================= -->
  <!-- FLOW ARROW 1 -->
  <!-- ========================================================= -->

  <line
    x1="600"
    y1="280"
    x2="600"
    y2="325"
    stroke="#FFFFFF"
    stroke-width="2.5"
  />

  <polygon
    points="590,315 610,315 600,328"
    fill="#FFFFFF"
  />

