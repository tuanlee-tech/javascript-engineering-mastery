<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="760"
  viewBox="0 0 1100 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Boolean Context và tập giá trị falsy đóng</title>
  <desc id="desc">
    Trong boolean context, JavaScript chuyển value thành true hoặc false.
    Tập falsy là một closed set gồm đúng tám giá trị: false, 0, -0, 0n,
    chuỗi rỗng, null, undefined và NaN. Mọi giá trị khác đều truthy.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="1100"
    height="760"
    rx="24"
    fill="#0B0E13"
  />

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <text
    x="550"
    y="54"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="29"
    font-weight="700"
    fill="#FFFFFF"
  >
    Boolean Context và Closed Set
  </text>

  <text
    x="550"
    y="84"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    JavaScript chuyển một value thành Boolean: false nếu thuộc tập falsy, ngược lại là true
  </text>

  <!-- =========================================================
       INPUT
       ========================================================= -->
  <rect
    x="385"
    y="116"
    width="330"
    height="62"
    rx="12"
    fill="#151A22"
    stroke="#FFFFFF"
    stroke-width="1.6"
  />

  <text
    x="550"
    y="154"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="21"
    font-weight="600"
    fill="#FFFFFF"
  >
    Value cần kiểm tra
  </text>

  <!-- Arrow -->
  <line
    x1="550"
    y1="178"
    x2="550"
    y2="215"
    stroke="#FFFFFF"
    stroke-width="2.5"
    marker-end="url(#arrow)"
  />

  <!-- =========================================================
       DECISION
       ========================================================= -->
  <rect
    x="350"
    y="225"
    width="400"
    height="92"
    rx="16"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <text
    x="550"
    y="257"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14"
    fill="#AAB2BF"
  >
    Kiểm tra Boolean context
  </text>

  <text
    x="550"
    y="286"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="700"
    fill="#FFFFFF"
  >
    “Có thuộc tập 8 giá trị falsy không?”
  </text>

  <line
    x1="415"
    y1="300"
    x2="685"
    y2="300"
    stroke="#374151"
    stroke-width="1"
  />

  <!-- =========================================================
       BRANCH LABELS
       ========================================================= -->
  <line
    x1="440"
    y1="317"
    x2="310"
    y2="355"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <line
    x1="660"
    y1="317"
    x2="790"
    y2="355"
    stroke="#FFFFFF"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="340"
    y="335"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="bold"
    fill="#FFF"

  >
    Có
  </text>

  <text
    x="790"
    y="335"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="bold"
    fill="#FFF"
  >
    Không
  </text>

  <!-- =========================================================
       FALSE RESULT
       ========================================================= -->
  <rect
    x="125"
    y="365"
    width="370"
    height="72"
    rx="14"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="310"
    y="394"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    fill="#AAB2BF"
  >
    Kết quả
  </text>

  <text
    x="310"
    y="421"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    fill="#FFFFFF"
  >
    false
  </text>

  <!-- TRUE RESULT -->
  <rect
    x="605"
    y="365"
    width="370"
    height="72"
    rx="14"
    fill="#1D2430"
    stroke="#FFFFFF"
    stroke-width="1.5"
  />

  <text
    x="790"
    y="394"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13"
    fill="#AAB2BF"
  >
    Kết quả
  </text>

  <text
    x="790"
    y="421"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="24"
    font-weight="700"
    fill="#FFFFFF"
  >
    true
  </text>

  <!-- =========================================================
       CLOSED SET
       ========================================================= -->
  <rect
    x="85"
    y="468"
    width="930"
    height="198"
    rx="20"
    fill="#151A22"
    stroke="#374151"
    stroke-width="1.5"
  />

  <text
    x="550"
    y="502"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="700"
    fill="#FFFFFF"
  >
    Closed Set — đúng 8 giá trị falsy
  </text>

  <text
    x="550"
    y="525"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
  >
    Tập hợp cố định để suy ra false trong Boolean context
  </text>

  <!-- Falsy chips -->
  <rect x="120" y="548" width="92" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="166" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">false</text>

  <rect x="226" y="548" width="72" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="262" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">0</text>

  <rect x="312" y="548" width="72" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="348" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">-0</text>

  <rect x="398" y="548" width="72" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="434" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">0n</text>

  <rect x="484" y="548" width="104" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="536" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">""</text>

  <rect x="602" y="548" width="86" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="645" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">null</text>

  <rect x="702" y="548" width="104" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="754" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">undefined</text>

  <rect x="820" y="548" width="78" height="40" rx="10" fill="#1D2430" stroke="#374151"/>
  <text x="859" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FFFFFF">NaN</text>

  <!-- =========================================================
       TRUTHY COUNTER EXAMPLES
       ========================================================= -->
  <text
    x="550"
    y="620"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    fill="#AAB2BF"
  >
    Ngoài closed set → truthy, kể cả:
  </text>

  <text
    x="550"
    y="646"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15"
    fill="#FFFFFF"
  >
    "0"   •   "false"   •   []   •   {}   •   function(){}
  </text>

  <!-- Footer -->
  <text
    x="550"
    y="713"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14"
    fill="#AAB2BF"
  >
    Mental model: không cần đoán “ý nghĩa” của value — chỉ cần biết nó thuộc tập falsy hay không
  </text>

</svg>