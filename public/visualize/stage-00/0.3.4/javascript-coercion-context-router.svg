<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="900"
  viewBox="0 0 1200 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Coercion: Context quyết định cách JavaScript chuyển đổi giá trị</title>
  <desc id="desc">
    Khi gặp mixed types, JavaScript trước hết phải xác định ngữ cảnh đang hoạt động.
    Boolean context dùng ToBoolean, String context phục vụ concatenation,
    Numeric context thường chuyển giá trị về Number cho các phép toán số học,
    còn Equality context dùng Abstract Equality Algorithm với các nhánh chuyển đổi
    khác nhau như Boolean sang Number, String sang Number, và Object sang Primitive.
  </desc>

  <defs>
