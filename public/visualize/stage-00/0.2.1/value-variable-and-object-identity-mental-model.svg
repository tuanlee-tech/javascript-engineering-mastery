<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 860"
  width="1200"
  height="860"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Value, Variable và Object Identity trong JavaScript
  </title>

  <desc id="desc">
    Variable là binding gắn một tên với một value. JavaScript values gồm
    Primitive Value và Object Value. Primitive immutable và không có identity
    riêng; Object mutable và có identity riêng. Hai object riêng biệt được tạo
    bởi hai object literal khác nhau có identity khác nhau.
  </desc>

  <!-- ========================================================= -->
  <!-- Background -->
  <!-- ========================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="860"
    rx="28"
    fill="#0B0E13"
  />

  <!-- ========================================================= -->
  <!-- Title -->
  <!-- ========================================================= -->

  <text
    x="600"
    y="55"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    fill="#FFFFFF"
  >
    Value, Variable &amp; Identity
  </text>

  <text
    x="600"
    y="87"
    text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    fill="#AAB2BF"
  >
    Ba khái niệm cần phân biệt khi JavaScript làm việc với dữ liệu
  </text>

