<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="760"
  viewBox="0 0 1100 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">typeof là bộ lọc 8 nhóm giá trị</title>
  <desc id="desc">
    typeof phân loại giá trị JavaScript vào một trong tám chuỗi kết quả:
    undefined, object, boolean, number, bigint, string, symbol và function.
    Array và null đều cho kết quả object.
  </desc>

  <defs>
