      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="1100"
    height="760"
    rx="24"
    fill="#0B0E13"
  />

