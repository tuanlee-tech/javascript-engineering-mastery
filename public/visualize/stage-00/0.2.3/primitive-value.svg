  <title id="title">Primitive value là giá trị nguyên tử</title>
  <desc id="desc">
    Năm primitive value 42, hello, true, null và undefined được biểu diễn như
    những giá trị nguyên tử độc lập. Mỗi giá trị không có phần bên trong để
    thay đổi trực tiếp.
  </desc>

